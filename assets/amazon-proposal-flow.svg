<text x="577" y="149" text-anchor="middle" fill="#eead93" font-size="11">DOWNSTREAM INTERRUPTION</text>
<rect x="50" y="197" width="193" height="81" rx="6" fill="#263b3a" stroke="#6d8781"/>
<text x="146" y="230" text-anchor="middle" class="node" fill="#efeee8">Upstream</text>
<text x="146" y="254" text-anchor="middle" class="node" fill="#efeee8">processing</text>
<path d="M243 238 H469" stroke="#a3b9b5" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#eead93"><rect x="272" y="224" width="17" height="27" rx="3"/><rect x="297" y="224" width="17" height="27" rx="3"/><rect x="322" y="224" width="17" height="27" rx="3"/></g>
<text x="310" y="211" text-anchor="middle" fill="#eead93" font-size="12">Work backs up</text>
<rect x="477" y="197" width="192" height="81" rx="6" fill="#382f2b" stroke="#ce9c86"/>
<text x="573" y="230" text-anchor="middle" class="node" fill="#efeee8">Shared</text>
<text x="573" y="254" text-anchor="middle" class="node" fill="#efeee8">downstream route</text>
<circle cx="446" cy="238" r="13" fill="#e6a285"/><path d="M442 232 V244 M449 232 V244" stroke="#2a2923" stroke-width="3"/>
<path d="M573 282 V304 H146 V282" fill="none" stroke="#eead93" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#back)"/>
<text x="360" y="345" text-anchor="middle" class="note" fill="#d3b7aa">A downstream stop can interrupt upstream flow.</text>

<rect x="28" y="394" width="664" height="260" rx="8" fill="#1a2d2b" stroke="#527069"/>
<text x="50" y="428" class="label" fill="#d2ded8">PROPOSED PILOT</text>
