<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Amazon proposal: existing dependency and proposed pilot</title>
<desc id="desc">A conceptual comparison. Existing: downstream interruptions on a shared route can back up upstream processing. Proposed: evaluate an alternative route through a controlled pilot, comparing throughput, alarms, downtime, and associate feedback. Presented; pilot not run. No actual site layout or performance data is shown.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a3b9b5" stroke-width="1.3"/></marker>
 <marker id="back" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#eead93" stroke-width="1.3"/></marker>
 <marker id="pilot" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a8dbcb" stroke-width="1.3"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif}.label{font-size:12px;letter-spacing:1.5px}.node{font-size:18px;font-weight:600}.note{font-size:14px}.small{font-size:12px}</style>
</defs>
<rect width="720" height="760" rx="10" fill="#142526"/>
<text x="36" y="40" fill="#aac2bc" class="label">OPERATIONS / CONCEPTUAL FLOW</text>
<text x="36" y="89" fill="#f2eee5" font-size="35" letter-spacing="-1">A dependency worth testing.</text>

<rect x="28" y="119" width="664" height="256" rx="8" fill="#1c2c2d" stroke="#405250"/>
<text x="50" y="150" class="label" fill="#d2ded8">EXISTING DEPENDENCY</text>
