<text x="146" y="497" text-anchor="middle" class="node" fill="#efeee8">Upstream</text>
<text x="146" y="521" text-anchor="middle" class="node" fill="#efeee8">processing</text>
<path d="M247 504 H469" stroke="#a8dbcb" fill="none" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#pilot)"/>
<text x="359" y="486" text-anchor="middle" fill="#a8dbcb" font-size="12">Temporary connection</text>
<rect x="477" y="464" width="192" height="81" rx="6" fill="#243b34" stroke="#a8dbcb" stroke-dasharray="6 5"/>
<text x="573" y="497" text-anchor="middle" class="node" fill="#efeee8">Alternative</text>
<text x="573" y="521" text-anchor="middle" class="node" fill="#efeee8">route</text>
