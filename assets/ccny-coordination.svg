<title id="title">CCNY capstone: coordinating three team workstreams</title>
<desc id="desc">David served as primary project manager, planning work, coordinating tasks, and communicating with stakeholders. Research, prototype work, and presentation design were team contributions. Meetings, stand-ups, and rehearsals supported coordination. This is a conceptual role map, not a project timeline.</desc>
